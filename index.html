<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achadinhos Online 🛍️</title>
    <meta name="description" content="Encontre os melhores produtos da Shopee, Shein e Mercado Livre com os menores preços." />
    <link rel="icon" type="image/png" href="fotos/favicon-16x16.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <button id="menuButton" class="menu-button" aria-label="Abrir menu de categorias">
                <span class="hamburger-icon">☰</span>
            </button>
            <a href="#" class="logo-link" aria-label="Página inicial Achadinhos Online">
                <img class="mascote-logo" src="fotos/mascote.jpg" alt="Mascote Achadinhos" />
                <img class="main-logo" src="fotos/foto2.png" alt="Logo Achadinhos" />
            </a>
            <h1>Achadinhos Online 🛍️</h1>
            <p class="tagline">Os melhores produtos da Shopee, Shein e ML com o menor preço 💸</p>
        </div>
        
        <nav class="categorias-desktop">
            <button class="category-btn active" data-categoria="todos">Todos</button>
            <button class="category-btn" data-categoria="roupas">Roupas</button>
            <button class="category-btn" data-categoria="acessorios">Acessórios</button>
            <button class="category-btn" data-categoria="beleza">Beleza</button>
            <button class="category-btn" data-categoria="tecnologia">Tecnologia</button>
            <button class="category-btn" data-categoria="suplementos">Suplementos</button>
            <button class="category-btn" data-categoria="decoracao">Decoração</button>
        </nav>
    </header>

    <aside class="sidebar" id="sidebar">
        <nav class="categorias-nav">
            <button class="category-btn active" data-categoria="todos">Todos</button>
            <button class="category-btn" data-categoria="roupas">Roupas</button>
            <button class="category-btn" data-categoria="acessorios">Acessórios</button>
            <button class="category-btn" data-categoria="beleza">Beleza</button>
            <button class="category-btn" data-categoria="tecnologia">Tecnologia</button>
            <button class="category-btn" data-categoria="suplementos">Suplementos</button>
            <button class="category-btn" data-categoria="decoracao">Decoração</button>
        </nav>
    </aside>

    <main class="produtos-grid" id="produtosContainer">
        <p class="featured-text">Produtos destaque da semana</p>
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Achadinhos Online. Todos os direitos reservados.</p>
    </footer>

    <img class="mascote-flutuante" src="fotos/mascote.jpg" alt="Mascote Achadinhos Online" />

    <script src="Js/Logica.js"></script>
</body>
</html>
